# One PantaUangmu instance (copied to /opt/panta/<name>/compose.yml by setup.sh).
# Same image as Railway: Express API + Mini App + bot (polling) + cron, SQLite in ./data.
name: panta-${PANTA_NAME:?}

services:
  app:
    build:
      context: ./repo
      dockerfile: Dockerfile
    # Image mode: ghcr.io image built by GitHub Actions (setup.sh sets PANTA_IMAGE on x86_64). Else built here.
    image: ${PANTA_IMAGE:-panta-${PANTA_NAME}:latest}
    restart: unless-stopped
    # ── Good neighbour on a shared server (e.g. next to Hermes) ──
    # RAM: hard cap, and no swap for Panta (memswap = mem) so the other app keeps the swap.
    mem_limit: ${MEM_LIMIT:-320m}
    memswap_limit: ${MEM_LIMIT:-320m}
    # CPU: at most this many cores, and half the scheduling weight of a default container/process.
    cpus: ${CPU_LIMIT:-0.75}
    cpu_shares: 512
    # If the server ever runs out of memory, the kernel kills Panta before the other app.
    oom_score_adj: 500
    pids_limit: 256
    env_file:
      # raw: values are taken literally, so '$' in ADMIN_PASSWORD_HASH or API keys is safe. Do not quote values.
      - path: ./app.env
        format: raw
    environment:
      NODE_ENV: production
      PORT: "3000"
      # V8 heap below the container cap so Node collects garbage instead of hitting the limit.
      NODE_OPTIONS: --max-old-space-size=${NODE_HEAP_MB:-192}
      DB_PATH: /data/finance.db
    volumes:
      - ./data:/data
    # Only Caddy (on the host) reaches the app; nothing is exposed publicly except 80/443.
    ports:
      - "127.0.0.1:${HOST_PORT:?}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
